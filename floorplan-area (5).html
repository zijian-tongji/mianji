<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>户型图面积计算</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#1c1c1e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff}

/* ── UPLOAD SCREEN ── */
#uploadScreen{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
  background:#1c1c1e;z-index:100;padding:32px;
}
#uploadScreen h1{font-size:22px;font-weight:600;letter-spacing:-.3px}
#uploadScreen p{font-size:14px;color:#8e8e93;text-align:center;line-height:1.6;max-width:280px}
.upload-btn{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  border:1.5px dashed #48484a;border-radius:20px;
  padding:36px 48px;cursor:pointer;transition:background .15s;
  background:#2c2c2e;
}
.upload-btn:active{background:#3a3a3c}
.upload-btn svg{opacity:.5}
.upload-btn span{font-size:15px;color:#8e8e93}

/* ── MAIN APP ── */
#app{position:fixed;inset:0;display:none;flex-direction:column}
#app.ready{display:flex}

/* canvas viewport — fills all space between topbar and toolbar */
#viewport{
  flex:1;overflow:hidden;position:relative;
  background:#111;touch-action:none;cursor:grab;
}
#viewport.drawing{cursor:crosshair}
#viewport.panning{cursor:grabbing}

canvas{
  position:absolute;top:0;left:0;
  transform-origin:0 0;
  image-rendering:auto;
}

/* ── TOP STATUS BAR ── */
#topbar{
  flex-shrink:0;
  display:flex;align-items:center;gap:8px;
  padding:env(safe-area-inset-top,12px) 14px 10px;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);
  background:rgba(28,28,30,.95);
  backdrop-filter:blur(10px);
  border-bottom:0.5px solid #38383a;
  min-height:50px;
}
#topbar .title{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .badge{
  font-size:11px;padding:3px 8px;border-radius:20px;font-weight:500;white-space:nowrap;flex-shrink:0;
}
.badge-ruler{background:#3a2f1a;color:#f0a830;border:0.5px solid #6b4f20}
.badge-draw{background:#1a2f3a;color:#5ac8fa;border:0.5px solid #1e5a7a}
.badge-pan{background:#1a1a2e;color:#9b8eff;border:0.5px solid #3d2f7a}
#scaleInfo{font-size:11px;color:#636366;flex-shrink:0}

/* ── BOTTOM TOOLBAR ── */
#toolbar{
  flex-shrink:0;
  background:rgba(28,28,30,.97);
  backdrop-filter:blur(12px);
  border-top:0.5px solid #38383a;
  padding:10px 14px;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
}

/* mode tabs row */
.tab-row{display:flex;gap:6px;margin-bottom:10px}
.tab{
  flex:1;padding:9px 4px;border-radius:10px;border:none;
  font-size:13px;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:5px;
  cursor:pointer;transition:all .15s;
}
.tab-ruler{background:#3a2f1a;color:#f0a830}
.tab-ruler.active{background:#f0a830;color:#1c1c1e}
.tab-draw{background:#1a2f3a;color:#5ac8fa}
.tab-draw.active{background:#5ac8fa;color:#1c1c1e}
.tab-result{background:#1a2e1a;color:#30d158}
.tab-result.active{background:#30d158;color:#1c1c1e}

/* action row */
.action-row{display:flex;gap:6px;align-items:stretch}
.act{
  flex:1;padding:9px 6px;border-radius:10px;border:0.5px solid #38383a;
  background:#2c2c2e;color:#ebebf5;font-size:12px;font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;transition:background .12s;
}
.act:active{background:#48484a}
.act.active{background:#1a2f3a;color:#5ac8fa;border-color:#1e5a7a}
.act.danger{background:#2e1a1a;color:#ff6b6b;border-color:#5a2020}
.act.confirm{background:#1a2e1a;color:#30d158;border-color:#1e5a2a}

/* hint strip */
#hint{
  font-size:11px;color:#636366;text-align:center;
  padding:6px 0 0;line-height:1.4;
}

/* ── RULER INPUT SHEET ── */
#rulerSheet{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:#2c2c2e;border-radius:20px 20px 0 0;
  border-top:0.5px solid #48484a;
  padding:16px 20px;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
}
#rulerSheet.open{transform:translateY(0)}
#rulerSheet h3{font-size:16px;font-weight:600;margin-bottom:14px}
.sheet-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.sheet-row label{font-size:13px;color:#8e8e93;min-width:70px}
#rulerReal{
  flex:1;padding:10px 14px;border-radius:10px;border:0.5px solid #48484a;
  background:#1c1c1e;color:#fff;font-size:16px;outline:none;min-width:0;
}
#rulerUnit{
  padding:10px 10px;border-radius:10px;border:0.5px solid #48484a;
  background:#1c1c1e;color:#fff;font-size:14px;
}
.sheet-btns{display:flex;gap:8px;margin-top:4px}
.sheet-btn{
  flex:1;padding:12px;border-radius:12px;border:none;
  font-size:15px;font-weight:600;cursor:pointer;
}
.sheet-btn.ok{background:#30d158;color:#1c1c1e}
.sheet-btn.cancel{background:#48484a;color:#fff}

/* ── RESULTS SHEET ── */
#resultsSheet{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:#2c2c2e;border-radius:20px 20px 0 0;
  border-top:0.5px solid #48484a;
  max-height:70vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
}
#resultsSheet.open{transform:translateY(0)}
.sheet-header{
  display:flex;align-items:center;padding:16px 20px 12px;
  border-bottom:0.5px solid #48484a;flex-shrink:0;
}
.sheet-header h3{flex:1;font-size:16px;font-weight:600}
.sheet-close{background:none;border:none;color:#8e8e93;font-size:22px;padding:0 0 0 10px;cursor:pointer;line-height:1}
.sheet-body{overflow-y:auto;padding:8px 20px 16px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.room-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid #38383a}
.room-row:last-of-type{border-bottom:none}
.rdot{width:12px;height:12px;border-radius:4px;flex-shrink:0}
.rname{flex:1;font-size:14px}
.rdim{font-size:11px;color:#636366}
.rarea{font-size:15px;font-weight:600;color:#30d158;white-space:nowrap}
.rdel{background:none;border:none;color:#48484a;font-size:18px;padding:4px 6px;cursor:pointer}
.rtotal{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 0 4px;font-size:16px;font-weight:700;
  border-top:1px solid #48484a;margin-top:4px;
}
.rtotal-val{color:#30d158}

/* ── BACKDROP ── */
#backdrop{
  position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.5);
  display:none;
}
#backdrop.show{display:block}

/* draw mode badge on canvas */
#drawBadge{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  background:rgba(90,200,250,.15);border:0.5px solid rgba(90,200,250,.4);
  color:#5ac8fa;font-size:12px;font-weight:500;
  padding:5px 12px;border-radius:20px;pointer-events:none;
  display:none;backdrop-filter:blur(6px);
}

/* magnifier loupe — shown above finger during drawing */
#loupe{
  position:absolute;pointer-events:none;display:none;
  width:96px;height:96px;border-radius:50%;
  border:2.5px solid rgba(255,255,255,0.6);
  box-shadow:0 4px 20px rgba(0,0,0,.6);
  overflow:hidden;
  z-index:10;
  /* positioned so centre of loupe is above finger */
  transform:translate(-50%,-100%);
  /* thin crosshair lines drawn on top via ::after */
}
#loupe::after{
  content:'';position:absolute;inset:0;
  background:
    linear-gradient(rgba(255,255,255,.25) 0,rgba(255,255,255,.25) calc(50% - 0.5px),transparent calc(50% - 0.5px),transparent calc(50% + 0.5px),rgba(255,255,255,.25) calc(50% + 0.5px),rgba(255,255,255,.25) 100%),
    linear-gradient(90deg,rgba(255,255,255,.25) 0,rgba(255,255,255,.25) calc(50% - 0.5px),transparent calc(50% - 0.5px),transparent calc(50% + 0.5px),rgba(255,255,255,.25) calc(50% + 0.5px),rgba(255,255,255,.25) 100%);
  border-radius:50%;
  pointer-events:none;
}
#loupeCanvas{width:96px;height:96px;display:block;border-radius:50%}
/* ruler/draw color ring */
#loupe.ruler{border-color:#f0a830}
#loupe.draw{border-color:#5ac8fa}

/* contact sheet */
#contactSheet{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:#2c2c2e;border-radius:20px 20px 0 0;
  border-top:0.5px solid #48484a;
  padding:20px 24px;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
  transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  text-align:center;
}
#contactSheet.open{transform:translateY(0)}
#contactSheet h3{font-size:16px;font-weight:600;margin-bottom:16px}
.wechat-box{
  background:#1c1c1e;border-radius:14px;padding:18px;
  display:flex;align-items:center;gap:14px;margin-bottom:16px;
}
.wechat-icon{
  width:44px;height:44px;border-radius:12px;background:#07c160;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.wechat-info{text-align:left}
.wechat-label{font-size:11px;color:#636366;margin-bottom:3px}
.wechat-id{font-size:18px;font-weight:700;letter-spacing:.5px;color:#fff}
.copy-btn{
  width:100%;padding:13px;border-radius:12px;border:none;
  background:#07c160;color:#fff;font-size:15px;font-weight:600;cursor:pointer;
}
.copy-btn:active{background:#05a050}
</style>
</head>
<body>

<!-- UPLOAD SCREEN -->
<div id="uploadScreen">
  <h1>户型图面积计算</h1>
  <p>上传户型图，标记比例尺，框选房间，自动计算面积</p>
  <label class="upload-btn" for="fileInput">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.5">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <span>点击上传户型图</span>
    <span style="font-size:12px;color:#48484a">JPG / PNG</span>
  </label>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
</div>

<!-- MAIN APP -->
<div id="app">
  <!-- top status bar -->
  <div id="topbar">
    <div class="title" id="topTitle">请先定标尺</div>
    <div class="badge badge-ruler" id="modeBadge">标尺模式</div>
    <div id="scaleInfo"></div>
  </div>

  <!-- canvas viewport -->
  <div id="viewport">
    <canvas id="c"></canvas>
    <div id="drawBadge">✏️ 绘制中 — 拖拽画矩形</div>
    <div id="loupe"><canvas id="loupeCanvas" width="192" height="192"></canvas></div>
  </div>

  <!-- bottom toolbar -->
  <div id="toolbar">
    <div class="tab-row">
      <button class="tab tab-ruler active" id="tabRuler" onclick="switchMode('ruler')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="15" width="22" height="6" rx="2"/><path d="M3 17l2-2m4 0l2-2m4 0l2-2"/></svg>
        定标尺
      </button>
      <button class="tab tab-draw" id="tabDraw" onclick="switchMode('draw')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
        画房间
      </button>
      <button class="tab tab-result" id="tabResult" onclick="openResults()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="16" y2="14"/></svg>
        查看面积
      </button>
      <button class="tab" style="background:#1a1a2a;color:#9b8eff;max-width:60px" onclick="openContact()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        联系
      </button>
    </div>
    <div class="action-row" id="actionRow">
      <!-- filled by JS per mode -->
    </div>
    <div id="hint"></div>
  </div>
</div>

<!-- RULER INPUT SHEET -->
<div id="rulerSheet">
  <h3>输入线段实际长度</h3>
  <div class="sheet-row">
    <label>实际长度</label>
    <input type="number" id="rulerReal" placeholder="例如 3600" inputmode="decimal" step="any" min="0">
    <select id="rulerUnit">
      <option value="1000">mm</option>
      <option value="100">cm</option>
      <option value="1" selected>m</option>
    </select>
  </div>
  <div class="sheet-btns">
    <button class="sheet-btn cancel" onclick="cancelRulerSheet()">取消</button>
    <button class="sheet-btn ok" onclick="confirmRuler()">✓ 确认比例尺</button>
  </div>
</div>

<!-- RESULTS SHEET -->
<div id="resultsSheet">
  <div class="sheet-header">
    <h3 id="resultsTitle">面积统计</h3>
    <button class="sheet-close" onclick="closeResults()">×</button>
  </div>
  <div class="sheet-body">
    <div id="roomList"></div>
    <div class="rtotal" id="totalRow" style="display:none">
      <span>合计</span><span class="rtotal-val" id="totalVal"></span>
    </div>
    <p id="emptyHint" style="font-size:13px;color:#636366;padding:8px 0">还没有房间，切换到"画房间"模式开始框选</p>
  </div>
</div>

<!-- CONTACT SHEET -->
<div id="contactSheet">
  <h3>联系我</h3>
  <div class="wechat-box">
    <div class="wechat-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M9.5 10.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm5 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/><path d="M21.7 13.35C21.88 12.92 22 12.46 22 12c0-3.87-4.03-7-9-7s-9 3.13-9 7 4.03 7 9 7c1.08 0 2.09-.17 3.03-.47L20 21l-1.51-3.78c1.96-1.23 3.21-3.07 3.21-3.87z"/></svg>
    </div>
    <div class="wechat-info">
      <div class="wechat-label">微信号</div>
      <div class="wechat-id" id="wechatId">llaaww1</div>
    </div>
  </div>
  <button class="copy-btn" onclick="copyWechat()">复制微信号</button>
</div>

<!-- BACKDROP -->
<div id="backdrop" onclick="closeAllSheets()"></div>

<script>
// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
const COLORS=['#7F77DD','#1D9E75','#D85A30','#5ac8fa','#D4537E','#30d158','#f0a830','#ff6b6b'];
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');

let img=null;
let mpp=null; // meters per pixel (in image coords)

// pan/zoom state
let panX=0,panY=0,scale=1;

// touch tracking
let lastTouches=[];
let pinchStartDist=0,pinchStartScale=1;
let pinchStartPanX=0,pinchStartPanY=0;
let panStartX=0,panStartY=0,panStartTouchX=0,panStartTouchY=0;
let isPanning=false;

// interaction mode: 'ruler' | 'draw'
let mode='ruler';
let drawSubMode='rect'; // 'rect' | 'ortho'

// drawing state
let isDrawing=false;       // currently in a draw gesture (double-tap activated drag)
let drawStart=null;        // {x,y} in image coords
let drawCurrent=null;
let orthoPoints=[];
let orthoMouse=null;

// ruler state
let rulerP1=null,rulerP2=null;
let rulerConfirmed=false;
let rulerDrawing=false;

// rooms
let rooms=[];

// double-tap detection
let lastTapTime=0,lastTapX=0,lastTapY=0;
const DOUBLE_TAP_MS=320,DOUBLE_TAP_PX=30;

// ─────────────────────────────────────────────
// UPLOAD
// ─────────────────────────────────────────────
document.getElementById('fileInput').addEventListener('change',e=>{
  if(e.target.files[0]) loadImg(e.target.files[0]);
});

function loadImg(file){
  const r=new FileReader();
  r.onload=ev=>{
    img=new Image();
    img.onload=()=>{
      canvas.width=img.width; canvas.height=img.height;
      // fit to screen initially
      const vw=window.innerWidth, vh=document.getElementById('viewport').clientHeight||window.innerHeight-160;
      scale=Math.min(vw/img.width, vh/img.height)*0.95;
      panX=(vw-img.width*scale)/2;
      panY=(vh-img.height*scale)/2;
      document.getElementById('uploadScreen').style.display='none';
      document.getElementById('app').classList.add('ready');
      switchMode('ruler');
      redraw();
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(file);
}

// ─────────────────────────────────────────────
// COORDINATE HELPERS
// ─────────────────────────────────────────────
function vpTop(){
  return document.getElementById('viewport').getBoundingClientRect().top;
}
function screenToImg(sx,sy){
  return {x:(sx-panX)/scale, y:(sy-vpTop()-panY)/scale};
}
function imgToScreen(ix,iy){
  return {x:ix*scale+panX, y:iy*scale+panY+vpTop()};
}
function getTouchMidpoint(t1,t2){
  return {x:(t1.clientX+t2.clientX)/2, y:(t1.clientY+t2.clientY)/2};
}
function getTouchDist(t1,t2){
  return Math.hypot(t1.clientX-t2.clientX, t1.clientY-t2.clientY);
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function applyTransform(){
  canvas.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;
}

function redraw(){
  if(!img) return;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(img,0,0);

  // ruler line
  if(rulerP1){
    const col=rulerConfirmed?'#30d158':'#f0a830';
    ctx.beginPath(); ctx.moveTo(rulerP1.x,rulerP1.y);
    if(rulerP2) ctx.lineTo(rulerP2.x,rulerP2.y);
    ctx.strokeStyle=col; ctx.lineWidth=2/scale; ctx.setLineDash([6/scale,3/scale]);
    ctx.stroke(); ctx.setLineDash([]);
    [rulerP1,rulerP2].forEach(p=>{
      if(!p) return;
      ctx.beginPath(); ctx.arc(p.x,p.y,5/scale,0,Math.PI*2);
      ctx.fillStyle=col; ctx.fill();
    });
    if(rulerP2){
      const mx=(rulerP1.x+rulerP2.x)/2, my=(rulerP1.y+rulerP2.y)/2;
      const tag=rulerConfirmed?'标尺 ✓':'标尺';
      drawImgLabel(ctx,mx,my,[tag],col);
    }
  }

  // rooms
  rooms.forEach(rm=>{
    const col=rm.color;
    ctx.beginPath();
    if(rm.type==='rect'){
      ctx.rect(rm.x1,rm.y1,rm.x2-rm.x1,rm.y2-rm.y1);
    } else {
      rm.points.forEach((p,j)=>j===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
      ctx.closePath();
    }
    ctx.fillStyle=col+'30'; ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=2/scale; ctx.stroke();
    const cx=rm.type==='rect'?(rm.x1+rm.x2)/2:rm.points.reduce((s,p)=>s+p.x,0)/rm.points.length;
    const cy=rm.type==='rect'?(rm.y1+rm.y2)/2:rm.points.reduce((s,p)=>s+p.y,0)/rm.points.length;
    const lines=[rm.name];
    if(mpp){
      const a=(roomPxArea(rm)*mpp*mpp).toFixed(2);
      if(rm.type==='rect'){
        const w=((rm.x2-rm.x1)*mpp).toFixed(2), h=((rm.y2-rm.y1)*mpp).toFixed(2);
        lines.push(w+'×'+h+' m');
      }
      lines.push(a+' m²');
    }
    drawImgLabel(ctx,cx,cy,lines,col);
  });

  // drawing preview — rect
  if(isDrawing && mode==='draw' && drawSubMode==='rect' && drawStart && drawCurrent){
    const x1=Math.min(drawStart.x,drawCurrent.x), y1=Math.min(drawStart.y,drawCurrent.y);
    const x2=Math.max(drawStart.x,drawCurrent.x), y2=Math.max(drawStart.y,drawCurrent.y);
    ctx.beginPath(); ctx.rect(x1,y1,x2-x1,y2-y1);
    ctx.fillStyle='#5ac8fa18'; ctx.fill();
    ctx.strokeStyle='#5ac8fa'; ctx.lineWidth=2/scale; ctx.setLineDash([5/scale,3/scale]);
    ctx.stroke(); ctx.setLineDash([]);
    if(mpp && (x2-x1)>10 && (y2-y1)>10){
      const w=((x2-x1)*mpp).toFixed(2), h=((y2-y1)*mpp).toFixed(2);
      drawImgLabel(ctx,(x1+x2)/2,(y1+y2)/2,[w+'×'+h+' m'],'#5ac8fa');
    }
  }

  // drawing preview — ortho
  if(mode==='draw' && drawSubMode==='ortho' && orthoPoints.length>0){
    ctx.beginPath();
    orthoPoints.forEach((p,j)=>j===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
    if(orthoMouse) ctx.lineTo(orthoMouse.x,orthoMouse.y);
    ctx.strokeStyle='#5ac8fa'; ctx.lineWidth=2/scale; ctx.setLineDash([5/scale,3/scale]);
    ctx.stroke(); ctx.setLineDash([]);
    orthoPoints.forEach(p=>{
      ctx.beginPath(); ctx.arc(p.x,p.y,4/scale,0,Math.PI*2);
      ctx.fillStyle='#5ac8fa'; ctx.fill();
    });
    if(orthoPoints.length>2){
      ctx.beginPath(); ctx.arc(orthoPoints[0].x,orthoPoints[0].y,8/scale,0,Math.PI*2);
      ctx.strokeStyle='#5ac8fa'; ctx.lineWidth=1.5/scale; ctx.stroke();
    }
  }

  applyTransform();
}

// draw label in image-coordinate space (compensate for scale)
function drawImgLabel(c,cx,cy,lines,col){
  const fs=13/scale, lh=17/scale, pad=7/scale, r=5/scale;
  c.font=`500 ${fs}px -apple-system,sans-serif`;
  const maxW=Math.max(...lines.map(l=>c.measureText(l).width))+pad*2;
  const bh=lines.length*lh+pad;
  c.fillStyle=col+'cc';
  rrect(c,cx-maxW/2,cy-bh/2,maxW,bh,r); c.fill();
  lines.forEach((l,i)=>{
    c.font=i===0?`600 ${fs}px -apple-system,sans-serif`:`${fs}px -apple-system,sans-serif`;
    c.fillStyle='#fff'; c.textAlign='center';
    c.fillText(l,cx,cy-bh/2+pad+i*lh+1.5/scale);
  });
}

function rrect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}

// ─────────────────────────────────────────────
// TOUCH HANDLING
// ─────────────────────────────────────────────
const vp=document.getElementById('viewport');

vp.addEventListener('touchstart',onTouchStart,{passive:false});
vp.addEventListener('touchmove',onTouchMove,{passive:false});
vp.addEventListener('touchend',onTouchEnd,{passive:false});
vp.addEventListener('touchcancel',onTouchEnd,{passive:false});

function onTouchStart(e){
  e.preventDefault();
  const touches=Array.from(e.touches);

  if(touches.length===2){
    // pinch start
    isPanning=false; isDrawing=false;
    pinchStartDist=getTouchDist(touches[0],touches[1]);
    pinchStartScale=scale;
    const mid=getTouchMidpoint(touches[0],touches[1]);
    pinchStartPanX=panX; pinchStartPanY=panY;
    // store mid in viewport-local coords
    pinchStartMid={x:mid.x, y:mid.y-vpTop()};
    lastTouches=touches;
    return;
  }

  if(touches.length===1){
    const t=touches[0];
    const now=Date.now();
    const dx=t.clientX-lastTapX, dy=t.clientY-lastTapY;
    const dist=Math.hypot(dx,dy);
    const isDoubleTap=(now-lastTapTime)<DOUBLE_TAP_MS && dist<DOUBLE_TAP_PX;

    if(isDoubleTap){
      // DOUBLE TAP → enter drawing gesture
      lastTapTime=0; // reset so triple tap doesn't trigger
      const imgPos=screenToImg(t.clientX,t.clientY);
      showFingerRing(t.clientX, t.clientY, mode==='ruler'?'ruler':'draw');
      startDraw(imgPos, t.clientX, t.clientY);
    } else {
      // single tap start — will become pan or draw commit depending on mode
      lastTapTime=now; lastTapX=t.clientX; lastTapY=t.clientY;
      if(isDrawing){
        // already in drawing mode: further taps add ortho points
        handleDrawTap(screenToImg(t.clientX,t.clientY));
      } else {
        // start pan
        isPanning=true;
        panStartX=panX; panStartY=panY;
        panStartTouchX=t.clientX; panStartTouchY=t.clientY;
        vp.classList.add('panning');
      }
    }
    lastTouches=touches;
  }
}

let pinchStartMid={x:0,y:0};

function onTouchMove(e){
  e.preventDefault();
  const touches=Array.from(e.touches);

  if(touches.length===2){
    hideFingerRing();
    // PINCH ZOOM
    const dist=getTouchDist(touches[0],touches[1]);
    const midClient=getTouchMidpoint(touches[0],touches[1]);
    const mid={x:midClient.x, y:midClient.y-vpTop()};
    const newScale=Math.min(Math.max(pinchStartScale*(dist/pinchStartDist),0.2),8);

    // zoom to midpoint (all in viewport-local coords)
    const imgMid=screenToImg_raw(pinchStartMid.x,pinchStartMid.y,pinchStartPanX,pinchStartPanY,pinchStartScale);
    panX=pinchStartMid.x - imgMid.x*newScale + (mid.x-pinchStartMid.x);
    panY=pinchStartMid.y - imgMid.y*newScale + (mid.y-pinchStartMid.y);
    scale=newScale;
    lastTouches=touches;
    redraw(); return;
  }

  if(touches.length===1){
    const t=touches[0];
    if(isDrawing && drawSubMode==='rect' && drawStart){
      // update draw preview
      drawCurrent=screenToImg(t.clientX,t.clientY);
      showFingerRing(t.clientX, t.clientY, 'draw');
      redraw(); return;
    }
    if(isDrawing && drawSubMode==='ortho'){
      const p=screenToImg(t.clientX,t.clientY);
      if(orthoPoints.length>0) orthoMouse=snapOrtho(orthoPoints[orthoPoints.length-1],p);
      showFingerRing(t.clientX, t.clientY, 'draw');
      redraw(); return;
    }
    if(isPanning){
      hideFingerRing();
      const dx=t.clientX-panStartTouchX, dy=t.clientY-panStartTouchY;
      panX=panStartX+dx; panY=panStartY+dy;
      redraw(); return;
    }
    // ruler draw
    if(mode==='ruler' && rulerDrawing && rulerP1){
      rulerP2=screenToImg(t.clientX,t.clientY);
      showFingerRing(t.clientX, t.clientY, 'ruler');
      redraw(); return;
    }
  }
}

function onTouchEnd(e){
  e.preventDefault();
  const touches=Array.from(e.changedTouches);
  vp.classList.remove('panning');
  hideFingerRing();

  if(e.touches.length===0){
    // all fingers lifted
    if(isPanning){ isPanning=false; }

    if(isDrawing && drawSubMode==='rect' && drawStart && drawCurrent){
      finishRectDraw();
      return;
    }

    if(mode==='ruler' && rulerDrawing && rulerP1 && rulerP2){
      rulerDrawing=false;
      const px=Math.hypot(rulerP2.x-rulerP1.x,rulerP2.y-rulerP1.y);
      if(px>6) openRulerSheet();
      else { rulerP1=null; rulerP2=null; }
      redraw(); return;
    }
  }
}

function screenToImg_raw(sx,sy,px,py,sc){
  return {x:(sx-px)/sc, y:(sy-py)/sc};
}

// ─────────────────────────────────────────────
// DRAWING
// ─────────────────────────────────────────────
function startDraw(imgPos, sx, sy){
  if(mode==='ruler'){
    // start ruler line
    rulerDrawing=true;
    rulerP1=imgPos; rulerP2=null;
    rulerConfirmed=false;
    document.getElementById('drawBadge').style.display='block';
    document.getElementById('drawBadge').textContent='📏 定标尺 — 拖动画线段';
    // immediately treat as pan-like drag for ruler
    // handled in touchmove under rulerDrawing
    return;
  }
  if(mode==='draw'){
    if(drawSubMode==='rect'){
      isDrawing=true;
      drawStart=imgPos; drawCurrent=imgPos;
      document.getElementById('drawBadge').style.display='block';
      document.getElementById('drawBadge').textContent='✏️ 绘制中 — 拖动画矩形';
      vp.classList.add('drawing');
    } else {
      // ortho: double tap to start, then single taps add points
      isDrawing=true;
      orthoPoints=[imgPos];
      document.getElementById('drawBadge').style.display='block';
      document.getElementById('drawBadge').textContent='✏️ 折线 — 点击添加顶点，双击完成';
      redraw();
    }
  }
}

function handleDrawTap(imgPos){
  if(mode==='draw' && drawSubMode==='ortho' && isDrawing){
    // close if near first point
    if(orthoPoints.length>2){
      const d=Math.hypot(imgPos.x-orthoPoints[0].x, imgPos.y-orthoPoints[0].y);
      if(d<20/scale){ finishOrthoDraw(); return; }
    }
    const snapped=snapOrtho(orthoPoints[orthoPoints.length-1],imgPos);
    orthoPoints.push(snapped);
    redraw();
  }
}

function finishRectDraw(){
  isDrawing=false;
  vp.classList.remove('drawing');
  document.getElementById('drawBadge').style.display='none';
  if(!drawStart || !drawCurrent) return;
  const x1=Math.min(drawStart.x,drawCurrent.x), y1=Math.min(drawStart.y,drawCurrent.y);
  const x2=Math.max(drawStart.x,drawCurrent.x), y2=Math.max(drawStart.y,drawCurrent.y);
  if((x2-x1)>4 && (y2-y1)>4){
    rooms.push({type:'rect',x1,y1,x2,y2,name:'房间'+(rooms.length+1),color:COLORS[rooms.length%COLORS.length]});
    updateTabResult();
  }
  drawStart=null; drawCurrent=null;
  redraw();
}

function finishOrthoDraw(){
  isDrawing=false;
  document.getElementById('drawBadge').style.display='none';
  if(orthoPoints.length>=3){
    rooms.push({type:'ortho',points:[...orthoPoints],name:'房间'+(rooms.length+1),color:COLORS[rooms.length%COLORS.length]});
    updateTabResult();
  }
  orthoPoints=[]; orthoMouse=null;
  redraw();
}

// double-tap in ortho mode finishes
// detect by checking lastTapTime again in startDraw:
// actually we handle it: if isDrawing+ortho and double-tap → finish
const origStartDraw=startDraw;
// override: if ortho+isDrawing and double-tap → finish
vp.addEventListener('touchstart',e=>{
  if(e.touches.length===1 && isDrawing && drawSubMode==='ortho'){
    const t=e.touches[0];
    const now=Date.now();
    const dx=t.clientX-lastTapX, dy=t.clientY-lastTapY;
    const dist=Math.hypot(dx,dy);
    if((now-lastTapTime)<DOUBLE_TAP_MS && dist<DOUBLE_TAP_PX){
      e.stopImmediatePropagation();
      finishOrthoDraw();
    }
  }
},{passive:false,capture:true});

function snapOrtho(prev,cur){
  const dx=Math.abs(cur.x-prev.x), dy=Math.abs(cur.y-prev.y);
  return dx>=dy?{x:cur.x,y:prev.y}:{x:prev.x,y:cur.y};
}

function buildResults(){
  const list=document.getElementById('roomList');
  const totalRow=document.getElementById('totalRow');
  const empty=document.getElementById('emptyHint');
  const titleEl=document.getElementById('resultsTitle');
  if(rooms.length===0){
    list.innerHTML=''; totalRow.style.display='none'; empty.style.display='block';
    titleEl.textContent='面积统计'; return;
  }
  empty.style.display='none';
  let sum=0;
  list.innerHTML=rooms.map((rm,i)=>{
    const pxA=roomPxArea(rm);
    const realA=mpp?pxA*mpp*mpp:null;
    if(realA) sum+=realA;
    let dim='';
    if(mpp&&rm.type==='rect'){
      dim=((rm.x2-rm.x1)*mpp).toFixed(2)+' × '+((rm.y2-rm.y1)*mpp).toFixed(2)+' m';
    }
    return `<div class="room-row">
      <div class="rdot" style="background:${rm.color}"></div>
      <div style="flex:1;min-width:0">
        <div class="rname" id="rname_${i}" ondblclick="renameRoom(${i})" style="cursor:pointer">${rm.name}</div>
        <div class="rdim">${dim}</div>
      </div>
      <div class="rarea">${realA?realA.toFixed(2)+' m²':'—'}</div>
      <button class="rdel" onclick="delRoom(${i})">×</button>
    </div>`;
  }).join('');
  if(mpp&&sum>0){
    totalRow.style.display='flex';
    document.getElementById('totalVal').textContent=sum.toFixed(2)+' m²';
    titleEl.textContent='面积统计 · 合计 '+sum.toFixed(2)+' m²';
  } else {
    totalRow.style.display='none';
    titleEl.textContent='面积统计';
  }
}

function renameRoom(i){
  const el=document.getElementById('rname_'+i);
  if(!el) return;
  const cur=rooms[i].name;
  const inp=document.createElement('input');
  inp.value=cur;
  inp.style.cssText='width:100%;font-size:14px;background:#1c1c1e;color:#fff;border:0.5px solid #5ac8fa;border-radius:6px;padding:2px 6px;outline:none';
  el.replaceWith(inp); inp.focus(); inp.select();
  const done=()=>{ const v=inp.value.trim(); rooms[i].name=v||cur; buildResults(); redraw(); };
  inp.addEventListener('blur',done);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter')inp.blur(); if(e.key==='Escape'){rooms[i].name=cur;buildResults();} });
}

// MAGNIFIER LOUPE
// ─────────────────────────────────────────────
const loupe=document.getElementById('loupe');
const loupeCanvas=document.getElementById('loupeCanvas');
const loupeCtx=loupeCanvas.getContext('2d');
const LOUPE_SIZE=96;       // display diameter px
const LOUPE_CANVAS=192;    // canvas pixel size (2x for sharp)
const LOUPE_ZOOM=2.5;      // magnification inside loupe
const LOUPE_GAP=14;        // gap between finger tip and loupe bottom edge

function showLoupe(clientX, clientY, type){
  const vpRect=document.getElementById('viewport').getBoundingClientRect();
  // position loupe: centred horizontally on finger, above finger
  let loupeLeft=clientX;
  let loupeTop=clientY - vpRect.top - LOUPE_GAP;

  // clamp so loupe stays inside viewport
  loupeLeft=Math.max(LOUPE_SIZE/2+4, Math.min(vpRect.width-LOUPE_SIZE/2-4, loupeLeft));
  loupeTop=Math.max(LOUPE_SIZE+4, loupeTop);

  loupe.style.left=loupeLeft+'px';
  loupe.style.top=loupeTop+'px';
  loupe.className=type||'draw';
  loupe.style.display='block';

  // draw magnified region into loupeCanvas
  // finger position in image coords
  const imgX=(clientX - vpRect.left - panX)/scale;
  const imgY=(clientY - vpRect.top  - panY)/scale;

  // how many image pixels fit in the loupe at magnification
  const halfImg=(LOUPE_SIZE/2)/LOUPE_ZOOM; // image-coord radius shown

  loupeCtx.clearRect(0,0,LOUPE_CANVAS,LOUPE_CANVAS);

  // clip to circle
  loupeCtx.save();
  loupeCtx.beginPath();
  loupeCtx.arc(LOUPE_CANVAS/2,LOUPE_CANVAS/2,LOUPE_CANVAS/2,0,Math.PI*2);
  loupeCtx.clip();

  // draw dark background first (in case image doesn't fill)
  loupeCtx.fillStyle='#111';
  loupeCtx.fillRect(0,0,LOUPE_CANVAS,LOUPE_CANVAS);

  // draw the main canvas (which already has image + overlays drawn on it)
  // source rect: region around finger in image coords
  const srcX=imgX-halfImg, srcY=imgY-halfImg;
  const srcW=halfImg*2,    srcH=halfImg*2;
  loupeCtx.drawImage(
    canvas,
    srcX, srcY, srcW, srcH,      // source region in image canvas
    0, 0, LOUPE_CANVAS, LOUPE_CANVAS  // dest: fill loupe canvas
  );

  // draw crosshair at centre of loupe
  loupeCtx.strokeStyle='rgba(255,255,255,0.7)';
  loupeCtx.lineWidth=1;
  loupeCtx.setLineDash([3,3]);
  const c=LOUPE_CANVAS/2;
  loupeCtx.beginPath(); loupeCtx.moveTo(c,0); loupeCtx.lineTo(c,LOUPE_CANVAS); loupeCtx.stroke();
  loupeCtx.beginPath(); loupeCtx.moveTo(0,c); loupeCtx.lineTo(LOUPE_CANVAS,c); loupeCtx.stroke();
  loupeCtx.setLineDash([]);

  loupeCtx.restore();
}

function hideLoupe(){
  loupe.style.display='none';
}

// alias old names used in touch handlers
function showFingerRing(clientX, clientY, type){ showLoupe(clientX, clientY, type); }
function hideFingerRing(){ hideLoupe(); }

  }
}

function setSubMode(sm){
  drawSubMode=sm;
  isDrawing=false; orthoPoints=[]; drawStart=null; drawCurrent=null;
  document.getElementById('drawBadge').style.display='none';
  vp.classList.remove('drawing');
  renderActionRow();
  setHint();
  redraw();
}

function setHint(){
  const h=document.getElementById('hint');
  if(mode==='ruler'){
    h.textContent=rulerConfirmed?'✓ 比例尺已确认 — 双击图纸重新定标尺':'双击图纸，拖动画出已知尺寸的线段';
  } else {
    if(drawSubMode==='rect') h.textContent='双击图纸开始 → 拖动画矩形 → 松手完成';
    else h.textContent='双击开始 → 单击添加顶点 → 再次双击完成';
  }
}

function resetRuler(){
  rulerP1=null; rulerP2=null; rulerConfirmed=false; mpp=null;
  document.getElementById('scaleInfo').textContent='';
  document.getElementById('tabRuler').style.background='';
  document.getElementById('tabRuler').style.color='';
  setHint();
  document.getElementById('topTitle').textContent='请定标尺';
  redraw();
}

function fitScreen(){
  if(!img) return;
  const vw=window.innerWidth, vh=document.getElementById('viewport').clientHeight;
  scale=Math.min(vw/img.width, vh/img.height)*0.95;
  panX=(vw-img.width*scale)/2; panY=(vh-img.height*scale)/2;
  redraw();
}

function undoLast(){
  if(isDrawing && drawSubMode==='ortho' && orthoPoints.length>0){ orthoPoints.pop(); redraw(); return; }
  if(rooms.length>0){ rooms.pop(); updateTabResult(); buildResults(); redraw(); }
}
function clearAll(){
  if(!confirm('清除所有房间？')) return;
  rooms=[]; orthoPoints=[]; drawStart=null; isDrawing=false;
  document.getElementById('drawBadge').style.display='none';
  vp.classList.remove('drawing');
  buildResults(); updateTabResult(); redraw();
}

// ─────────────────────────────────────────────
// AREA HELPERS
// ─────────────────────────────────────────────
function polyArea(pts){
  let a=0;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++) a+=(pts[j].x+pts[i].x)*(pts[j].y-pts[i].y);
  return Math.abs(a/2);
}
function roomPxArea(rm){
  return rm.type==='rect'?(rm.x2-rm.x1)*(rm.y2-rm.y1):polyArea(rm.points);
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
switchMode('ruler');
